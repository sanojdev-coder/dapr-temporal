server.port=8081
spring.application.name=fraud-service

# Temporal frontend address, used to signal the payment workflow directly.
temporal.service-address=${TEMPORAL_SERVICE_ADDRESS:localhost:7233}

# ---- Observability ----
management.endpoints.web.exposure.include=health,prometheus
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://tempo:4318/v1/traces
