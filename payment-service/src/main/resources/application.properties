server.port=8080
spring.application.name=payment-service

# Temporal frontend address. Overridden by TEMPORAL_SERVICE_ADDRESS env var in docker-compose.
temporal.service-address=${TEMPORAL_SERVICE_ADDRESS:localhost:7233}

# ---- Observability ----
management.endpoints.web.exposure.include=health,prometheus
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://tempo:4318/v1/traces
